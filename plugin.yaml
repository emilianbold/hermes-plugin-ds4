name: ds4
kind: model-provider
version: "0.2.0"
description: Managed ds4 (antirez/ds4, DwarfStar) runtime for Hermes Desktop on Apple Silicon - installs the engine, manages its models, runs ds4-server. Also attaches to a ds4-server you run yourself.
author: Emilian Bold
license: MIT
requires_hermes: ">=0.23.0"
platforms:
  - macos
python_dependencies:
  - "psutil>=5.9,<9"
  - "fastapi>=0.100,<1"
  - "httpx>=0.27,<1"
  - "openai>=1.0,<3"
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
